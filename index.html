<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dupery Junior</title>
<style>
  :root { --ink: #263238; --paper: #fff8e7; --accent: #ef6c00; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 3px solid #f1e3b8; }
  header h1 { margin: 0 auto 0 0; font-size: 1.4rem; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 12px; border: 2px solid #b0bec5; background: #fff; cursor: pointer; color: var(--ink); }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.big { font-size: 1.3rem; padding: 12px 24px; background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { margin: 16px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .row > b { min-width: 230px; }
  .card { background: #fff; border-radius: 16px; padding: 12px 16px; margin: 10px 0; }
  .profile { font-size: 1.3rem; }
  .stamps { display: flex; flex-wrap: wrap; gap: 10px; }
  .stamp { width: 150px; padding: 10px; text-align: center; background: #fff; border: 3px dashed #c62828; border-radius: 14px; transform: rotate(-2deg); }
  .stamp .e { font-size: 2.4rem; }
  .stamp small { display: block; color: #546e7a; font-size: .8rem; }
  .stamp.locked { filter: grayscale(1); opacity: .55; border-color: #90a4ae; }
  .stamp.fresh { animation: pop .5s; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); } }
  .bar { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: 1.2rem; margin-bottom: 10px; }
  .banner { padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; font-size: 1.3rem; }
  .banner.win { background: #c8e6c9; } .banner.lose { background: #ffcdd2; }
  .board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 12px; }
  .cell { position: relative; border-radius: 16px; padding: 8px; border: 4px solid transparent; cursor: pointer; text-align: center; }
  .cell.sel { border-color: var(--ink); }
  .cell.hl { border-color: #6a1b9a; border-style: dashed; }
  .cell.thief { border-color: #c62828; border-width: 6px; }
  .cell.arrested { opacity: .55; }
  .animal { height: 100px; display: flex; justify-content: center; }
  .pic { position: relative; height: 100%; }
  .acc { position: absolute; inset: 0; width: 100%; height: 100%; }
  .face { height: 100%; display: block; }
  .badge { position: absolute; top: 6px; right: 8px; font-size: 30px; }
  .bubble { background: #fff; border-radius: 14px; padding: 8px; font-size: 1.5rem; line-height: 1.6; min-height: 5.2rem; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 .4em; font-weight: 600; }
  .cardback { min-height: 5.2rem; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 3px dashed #90a4ae; background: #ffffffaa; color: #546e7a; font-size: 1.3rem; font-weight: 600; }
  .w { white-space: nowrap; }
  .syl .s0 { color: #1a237e; } .syl .s1 { color: #c2185b; } .syl .w { letter-spacing: .06em; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; }
  .tools button { padding: 4px 8px; font-size: .9rem; }
  .say { font-size: 1rem; padding: 2px 8px; }
  @media (max-width: 700px) { .bubble { font-size: 1.2rem; } .animal { height: 76px; } }
</style>
</head>
<body>
<header id="head"></header>
<main id="app"></main>
<script src="game.js"></script>
<script>
const G = Game;
const KEY = 'dupery-junior:v1';
const DEFAULTS = { size: '3x3', k: 1, liars: false, read: true, hints: true, syl: true, lives: 5 };
const AVATARS = ['🦸', '🕵️', '🧙', '🧑‍🚀', '🦄', '🐲', '🤖', '👑'];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let store = { profiles: {}, current: null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.profiles) store = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const me = () => store.profiles[store.current];
const ui = { screen: store.current && me() ? 'setup' : 'profiles', game: null, confirm: null, pickAvatar: AVATARS[0] };

// ---- speech: one word is free, a whole sentence costs a token ----
function say(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'pl-PL'; u.rate = 0.8;
  speechSynthesis.speak(u);
}

// ---- game state ----
function startGame() {
  const s = me().settings;
  const [cols, rows] = G.SIZES[s.size];
  const c = G.generateCase({ cols, rows, k: s.k, liars: s.liars });
  if (!c) { alert('Nie udało się stworzyć sprawy. Spróbuj jeszcze raz.'); return; }
  ui.game = { c, s: { ...s }, marks: {}, revealed: [], arrested: [], lives: s.lives, tokens: 2, selected: null, over: null, earned: [] };
  ui.confirm = null; ui.screen = 'game';
}
function arrest(i) {
  const g = ui.game;
  if (g.c.thieves.includes(i)) {
    g.arrested.push(i);
    if (g.arrested.length === g.c.k) {
      g.over = 'win'; g.earned = G.earned(g.s);
      const st = me().stamps; g.earned.forEach((id) => { st[id] = (st[id] || 0) + 1; });
      save();
    }
  } else {
    g.marks[i] = 'ok'; g.lives--; g.wrong = i;
    if (g.lives <= 0) g.over = 'lose';
  }
  g.selected = null; ui.confirm = null;
}

// ---- rendering ----
const colour = (id) => G.COLOURS.find((x) => x.id === id);
const species = (id) => G.SPECIES.find((x) => x.id === id);
const hearts = (n, max) => '❤️'.repeat(n) + '🖤'.repeat(max - n);

function wordHTML(w, s, first) {
  let inner;
  if (s.syl) {
    const parts = G.syllables(w).slice();
    if (first) parts[0] = parts[0][0].toUpperCase() + parts[0].slice(1);
    inner = parts.map((p, j) => `<span class="s${j % 2}">${esc(p)}</span>`).join('');
  } else inner = esc(w);
  const col = s.hints && G.COLOURS.find((x) => x.loc === w);
  const style = col ? ` style="color:${col.ink}"` : '';
  return `<span class="w" data-word="${esc(w)}"${style}>${inner}</span>`;
}
function bubbleHTML(i) {
  const g = ui.game, st = g.c.statements[i], k = g.c.k;
  const ws = G.words(st, k);
  let h = ws.map((w, j) => wordHTML(w, g.s, j === 0).replace(/<\/span>$/, (j === ws.length - 1 ? '.' : '') + '</span>')).join(' ');
  if (g.s.hints) h += ' ' + G.arrowOf(st);
  if (g.s.read) h += ` <button class="say" data-act="say" data-i="${i}" ${g.tokens ? '' : 'disabled'} title="Przeczytaj całe zdanie">🔊</button>`;
  return h;
}
function cellHTML(i) {
  const g = ui.game, cell = g.c.board.cells[i], over = !!g.over;
  const arrested = g.arrested.includes(i), shown = over || g.revealed.includes(i), sel = g.selected === i && !over;
  const badge = arrested ? '🚓' : g.marks[i] === 'ok' ? '✅' : g.marks[i] === '?' ? '❓' : '';
  const cls = ['cell', g.s.syl ? 'syl' : '', sel ? 'sel' : '', arrested ? 'arrested' : '', g.over === 'lose' && g.c.thieves.includes(i) ? 'thief' : ''].join(' ');
  const img = species(cell.species).img;
  const acc = ['hat', 'glasses', 'scarf'].map((a) => (cell[a] ? `<img class="acc" alt="" src="assets/accessories/${img}-${a}.svg">` : '')).join('');
  let tools = '';
  if (sel && !arrested) {
    const conf = ui.confirm === i;
    tools = `<div class="tools">
      <button data-act="mark" data-i="${i}" data-m="ok">✅ niewinny</button>
      <button data-act="mark" data-i="${i}" data-m="?">❓ podejrzany</button>
      <button data-act="arrest" data-i="${i}" class="${conf ? 'on' : ''}">🚓 ${conf ? 'na pewno?' : 'aresztuj'}</button></div>`;
  }
  return `<div class="${cls}" data-i="${i}" style="background:${colour(cell.colour).css}">
    <div class="animal"><div class="pic"><img class="face" alt="${species(cell.species).id}" src="assets/animals/${img}.png">${acc}</div></div>
    <span class="badge">${badge}</span>
    ${shown ? `<div class="bubble" data-i="${i}">${bubbleHTML(i)}</div>` : '<div class="cardback">Kliknij</div>'}${tools}</div>`;
}
function bannerHTML() {
  const g = ui.game;
  if (!g.over) return '';
  const next = '<div class="row"><button class="big" data-act="again">Nowa sprawa</button><button data-act="screen" data-v="setup">Ustawienia</button><button data-act="screen" data-v="album">Album</button></div>';
  if (g.over === 'win') {
    const st = g.earned.map((id) => { const x = G.STAMPS.find((y) => y.id === id); return `<div class="stamp fresh"><div class="e">${x.emoji}</div>${x.name}</div>`; }).join('');
    return `<div class="banner win"><b>Brawo! Sprawa rozwiązana. Ciastko wróciło.</b><div class="stamps" style="margin:10px 0">${st}</div>${next}</div>`;
  }
  return `<div class="banner lose"><b>Tym razem się nie udało. Złodzieje są zaznaczeni na czerwono.</b>${next}</div>`;
}
function gameHTML() {
  const g = ui.game, k = g.c.k, left = k - g.arrested.length;
  const goal = k === 1 ? 'Zniknęło ciastko 🍪. Znajdź złodzieja.' : `Zniknęły ciastka 🍪. Znajdź ${k === 2 ? 'dwóch' : 'trzech'} złodziei.`;
  return `${bannerHTML()}<div class="bar"><span>${goal}</span><span>${hearts(g.lives, g.s.lives)}</span>
    ${g.s.read ? `<span title="Zdania do przeczytania na głos">🔊 × ${g.tokens}</span>` : ''}${k > 1 ? `<span>Do złapania: ${left}</span>` : ''}</div>
    <div class="board" style="--cols:${g.c.board.cols}">${g.c.board.cells.map((_, i) => cellHTML(i)).join('')}</div>`;
}

function seg(key, opts) {
  const s = me().settings;
  return opts.map(([v, label, dis]) => `<button class="${s[key] === v ? 'on' : ''}" data-act="set" data-k="${key}" data-v='${JSON.stringify(v)}' ${dis ? 'disabled' : ''}>${label}</button>`).join('');
}
function setupHTML() {
  const s = me().settings, no3 = G.maxThieves(s.size) < 3;
  const gets = G.earned(s).map((id) => { const x = G.STAMPS.find((y) => y.id === id); return `<div class="stamp"><div class="e">${x.emoji}</div>${x.name}</div>`; }).join('');
  const onoff = (key) => seg(key, [[true, 'Włączone'], [false, 'Wyłączone']]);
  return `<h2>Wybierz trudność</h2><div class="card">
    <div class="row"><b>Plansza</b>${seg('size', [['3x3', '3×3'], ['4x3', '4×3'], ['4x4', '4×4']])}</div>
    <div class="row"><b>Złodzieje</b>${seg('k', [[1, '1'], [2, '2'], [3, '3', no3]])}</div>
    <div class="row"><b>Złodzieje kłamią</b>${seg('liars', [[false, 'Nie'], [true, 'Tak']])}</div>
    <div class="row"><b>Czytanie na głos</b>${onoff('read')}</div>
    <div class="row"><b>Strzałki i kolory</b>${onoff('hints')}</div>
    <div class="row"><b>Sylaby</b>${onoff('syl')}</div>
    <div class="row"><b>Życia</b>${seg('lives', [[5, '5'], [3, '3'], [1, '1']])}</div></div>
    <h2>Stemple za tę sprawę</h2><div class="stamps">${gets}</div>
    <p><button class="big" data-act="start">Zacznij sprawę</button></p>`;
}
function albumHTML() {
  const have = me().stamps;
  const tiles = G.STAMPS.map((x) => {
    const n = have[x.id] || 0;
    return `<div class="stamp ${n ? '' : 'locked'}"><div class="e">${x.emoji}</div><b>${x.name}</b>${n ? ` × ${n}` : ''}<small>${x.need}</small></div>`;
  }).join('');
  const total = Object.values(have).reduce((a, b) => a + b, 0);
  return `<h2>Album detektywa</h2><p>Stempli razem: <b>${total}</b>. Szare stemple jeszcze czekają. Pod nazwą jest napisane, co włączyć.</p><div class="stamps">${tiles}</div>
    <p><button class="big" data-act="screen" data-v="setup">Wróć do ustawień</button></p>`;
}
function profilesHTML() {
  const list = Object.entries(store.profiles).map(([n, p]) => `<button class="profile" data-act="login" data-n="${esc(n)}">${p.avatar} ${esc(n)}</button>`).join(' ');
  const av = AVATARS.map((a) => `<button class="${ui.pickAvatar === a ? 'on' : ''}" data-act="avatar" data-a="${a}">${a}</button>`).join(' ');
  return `<h2>Kto gra?</h2><div class="row">${list || '<i>Nie ma jeszcze profili.</i>'}</div>
    <h2>Nowy profil</h2><div class="card">
    <p>Wpisz pseudonim. Nie wpisuj imienia i nazwiska. Dane zostają w tej przeglądarce.</p>
    <div class="row"><input id="nick" maxlength="12" placeholder="Pseudonim" value="${esc(ui.nick || '')}" style="font:inherit;padding:8px;border-radius:10px;border:2px solid #b0bec5"> ${av}
    <button class="big" data-act="create">Utwórz</button></div></div>
    <h2>Kopia zapasowa</h2><div class="row"><button data-act="export">Zapisz profile do pliku</button>
    <label>Wczytaj z pliku: <input type="file" accept=".json" id="import"></label></div>`;
}
function render() {
  const p = store.current && me();
  document.getElementById('head').innerHTML = `<h1>🔍 Dupery Junior</h1>` + (p
    ? `<span>${p.avatar} ${esc(store.current)}</span><button data-act="screen" data-v="setup">Ustawienia</button><button data-act="screen" data-v="album">Album</button><button data-act="screen" data-v="profiles">Zmień profil</button>` : '');
  const html = { profiles: profilesHTML, setup: setupHTML, album: albumHTML, game: gameHTML }[ui.screen]();
  document.getElementById('app').innerHTML = html;
}

// ---- events ----
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],.w,.cell');
  if (!t) return;
  const act = t.dataset.act, g = ui.game;
  if (t.classList.contains('w') && !act) { if (ui.screen === 'game' && g.s.read) say(t.dataset.word); return; }
  if (!act) { // cell
    if (ui.screen !== 'game' || g.over) return;
    const i = +t.dataset.i;
    if (!g.revealed.includes(i)) g.revealed.push(i); // first click shows the sentence
    else g.selected = g.selected === i ? null : i;
    ui.confirm = null;
    return render();
  }
  const i = +t.dataset.i;
  switch (act) {
    case 'screen': ui.screen = t.dataset.v; break;
    case 'avatar': ui.pickAvatar = t.dataset.a; ui.nick = document.getElementById('nick').value; break;
    case 'create': {
      const n = document.getElementById('nick').value.trim();
      if (!n) return;
      if (!store.profiles[n]) store.profiles[n] = { avatar: ui.pickAvatar, stamps: {}, settings: { ...DEFAULTS } };
      store.current = n; save(); ui.screen = 'setup'; break;
    }
    case 'login': store.current = t.dataset.n; save(); ui.screen = 'setup'; break;
    case 'set': {
      const s = me().settings; s[t.dataset.k] = JSON.parse(t.dataset.v);
      s.k = Math.min(s.k, G.maxThieves(s.size)); save(); break;
    }
    case 'start': case 'again': startGame(); break;
    case 'say': say(G.sentence(g.c.statements[i], g.c.k)); g.tokens--; break;
    case 'mark': g.marks[i] = g.marks[i] === t.dataset.m ? null : t.dataset.m; break;
    case 'arrest': if (ui.confirm === i) arrest(i); else ui.confirm = i; break;
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(store)], { type: 'application/json' }));
      a.download = `${new Date().toISOString().slice(0, 10)} - Dupery Junior profile.json`; a.click(); return;
    }
  }
  render();
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'import' || !e.target.files[0]) return;
  e.target.files[0].text().then((txt) => {
    try {
      const d = JSON.parse(txt);
      if (!d.profiles || typeof d.profiles !== 'object') throw 0;
      Object.assign(store.profiles, d.profiles); save(); render();
    } catch (err) { alert('Ten plik nie jest kopią profili.'); }
  });
});
// Hints: pointing at a sentence lights up the animals it talks about.
const lit = (on, e) => {
  const b = e.target.closest('.bubble');
  if (!b || ui.screen !== 'game' || !ui.game.s.hints) return;
  const g = ui.game, i = +b.dataset.i;
  const cells = G.cellsOf(g.c.statements[i], i, g.c.board);
  document.querySelectorAll('.cell').forEach((el) => el.classList.toggle('hl', on && cells.includes(+el.dataset.i)));
};
document.addEventListener('mouseover', (e) => lit(true, e));
document.addEventListener('mouseout', (e) => lit(false, e));
render();
</script>
</body>
</html>
